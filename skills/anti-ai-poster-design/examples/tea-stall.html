<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Tea stall - Giant Word layout (Bengali)</title>
<!-- Sample content for demonstration. Shop name, address and prices are placeholders/sample values. -->
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;800&family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
  @page { size: 1080px 1350px; margin: 0; }
  :root {
    --ground:#F2E6D3; --support:#C9633A; --accent:#2B5B4A; --ink:#2A1D17;
    --font-indic:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",sans-serif;
    --font-text:"Hind Siliguri","Noto Sans Bengali",sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1350px; background:var(--ground); }
  .poster { position:relative; width:1080px; height:1350px; overflow:hidden; background:var(--ground);
    color:var(--ink); font-family:var(--font-text); padding:78px 86px; display:flex; flex-direction:column; }
  .meta { font-size:32px; font-weight:500; display:flex; justify-content:space-between; }
  .display { font-family:var(--font-indic); font-weight:800; font-size:720px; line-height:1.0;
    color:var(--support); margin-top:20px; margin-left:-10px; letter-spacing:0; }
  .cup { position:absolute; right:76px; top:352px; width:380px; height:440px; }
  .support { margin-top:auto; font-size:76px; font-weight:700; line-height:1.3; width:860px; letter-spacing:0; }
  .detail { margin-top:14px; font-size:44px; font-weight:500; letter-spacing:0; }
  .action { margin-top:56px; display:flex; align-items:center; justify-content:space-between; }
  .cta { background:var(--accent); color:var(--ground); font-size:46px; font-weight:700; padding:22px 50px 26px;
    border-radius:12px; letter-spacing:0; }
  .where { font-size:44px; font-weight:500; letter-spacing:0; }
</style>
</head>
<body>
<div class="poster">
  <div class="meta"><span>[দোকানের নাম]</span><span>প্রতিদিন</span></div>
  <div class="display">চা</div>

  <!-- one hero object: a flat kulhad, no steam, no gloss, one colour family -->
  <svg class="cup" viewBox="0 0 380 440" xmlns="http://www.w3.org/2000/svg">
    <path d="M40 60 L340 60 L300 370 Q296 410 256 410 L124 410 Q84 410 80 370 Z" fill="#2B5B4A"/>
    <ellipse cx="190" cy="60" rx="150" ry="26" fill="#1E4336"/>
    <ellipse cx="190" cy="62" rx="128" ry="17" fill="#C9633A"/>
    <rect x="62" y="170" width="256" height="22" fill="#F2E6D3" opacity="0.9"/>
    <rect x="70" y="232" width="240" height="22" fill="#F2E6D3" opacity="0.9"/>
  </svg>

  <p class="support">গরম কচুরি আর ডালপুরি</p>
  <p class="detail">কচুরি ₹২০ · ডালপুরি ₹২৫ · সকাল থেকে রাত</p>

  <div class="action">
    <div class="cta">আজই আসুন</div>
    <div class="where">[ঠিকানা]</div>
  </div>
</div>
</body>
</html>
